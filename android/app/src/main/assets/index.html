<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Intel V44.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        :root { --accent: #00f2ff; --safety: #facc15; }
        html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; }
        .page { display: none; flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }
        .active-page { display: flex !important; flex-direction: column; }
        #page-dash { padding: 20px; padding-top: 60px; justify-content: space-between; overflow-y: auto; }
        #map-canvas { position: absolute !important; top: 0; left: 0; width: 100% !important; height: 100% !important; background: #111; z-index: 10; }
        .nav-bar { height: 80px; background: #111; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2px solid #333; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.4; font-size: 11px; font-weight: 800; }
        .nav-btn-active { opacity: 1; color: var(--accent); background: #1a1a1a; border-top: 4px solid var(--accent); }
        #master-toggle { background: var(--safety); color: #000; padding: 20px; border-radius: 15px; font-size: 22px; font-weight: 900; width: 100%; border: 4px solid #fff; text-transform: uppercase; margin-bottom: 5px; }
        .btn-active { background: #ff4444 !important; color: #fff !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="page-dash" class="page active-page">
        <div id="shield-box" class="bg-purple-700 p-2 rounded text-center font-bold text-[10px] uppercase">Shield Active</div>
        <div class="text-center">
            <div class="text-[10px] text-zinc-500 uppercase mb-1">Live Flow Rating</div>
            <span id="live-rate-val" class="text-7xl font-black text-zinc-700">10.0</span>
        </div>
        <div class="grid grid-cols-2 gap-4 bg-zinc-900/60 p-4 rounded-xl border border-zinc-800">
            <div class="text-center"><span id="speed-out" class="text-3xl font-black italic">0.0</span><div class="text-[8px] text-cyan-400 font-bold uppercase">KM/H</div></div>
            <div class="text-center"><span id="live-dist" class="text-3xl font-black">0.00</span><div class="text-[8px] text-zinc-500 font-bold uppercase">KM</div></div>
        </div>
        <div class="text-center bg-zinc-900 py-4 rounded-2xl border border-zinc-700">
            <div id="timer-display" class="text-5xl font-black text-cyan-400">0.0</div>
            <div class="text-[9px] text-zinc-400 uppercase font-black">Idle Time</div>
        </div>
        <button id="master-toggle" onclick="toggleEngine()">Start Engine</button>
    </div>

    <div id="page-map" class="page"><div id="map-canvas"></div></div>

    <div id="page-logs" class="page !overflow-y-auto p-5"><div id="log-list" class="pb-10"></div></div>

    <div id="page-stops" class="page !overflow-y-auto p-5"><div id="stops-list" class="pb-10"></div></div>

    <div id="page-sys" class="page !overflow-y-auto p-5">
        <div class="bg-zinc-900 p-4 rounded border border-zinc-800 mb-4 text-[10px] flex justify-between">
            <span>Data Stabilization:</span>
            <span class="text-green-500 font-bold uppercase">Active</span>
        </div>
        <button onclick="wipeAll()" class="w-full bg-red-950 text-red-500 p-4 rounded font-black uppercase border border-red-900 mb-4">Factory Wipe</button>

        <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] text-zinc-500 uppercase font-bold">Diagnostic Log</span>
            <div class="flex gap-2">
                <button onclick="shareDiagnosticLog()" class="bg-cyan-950 text-cyan-400 text-[9px] font-black uppercase px-3 py-1 rounded">Share</button>
                <button onclick="clearDiagnosticLog()" class="bg-zinc-800 text-zinc-300 text-[9px] font-black uppercase px-3 py-1 rounded">Clear</button>
            </div>
        </div>
        <pre id="diag-log" class="bg-zinc-900 border border-zinc-800 rounded p-3 text-[9px] text-zinc-400 whitespace-pre-wrap break-words pb-10"></pre>
    </div>

    <nav class="nav-bar">
        <div onclick="tab('dash')" id="tab-dash" class="nav-btn nav-btn-active">DASH</div>
        <div onclick="showLiveMap()" id="tab-map" class="nav-btn">MAP</div>
        <div onclick="tab('logs')" id="tab-logs" class="nav-btn">LOGS</div>
        <div onclick="tab('stops')" id="tab-stops" class="nav-btn">STOPS</div>
        <div onclick="tab('sys')" id="tab-sys" class="nav-btn">SYS</div>
    </nav>
</div>

<script>
    // All tracking - GPS, distance, idle timer, flow rating, trip storage - now lives
    // natively in TrackingService, so it keeps running when this page isn't visible.
    // This script only renders whatever state window.onNativeUpdate() is handed, and
    // forwards button taps to window.Native (see NativeBridge.java).
    let isArmed = false, map = null, userMarker = null;

    // "Similar trips" = same rough start point AND same rough end point (e.g. a
    // repeated commute), not just any two trips - see groupTripsByRoute below.
    // Kept here as named constants (not buried in the functions) since they're
    // the two knobs most likely to need retuning once this is used against real
    // recorded trips instead of reasoned about in the abstract.
    const ROUTE_ENDPOINT_MATCH_METERS = 400; // how close two trips' start/end points must be to count as "the same route"
    const STOP_CLUSTER_RADIUS_METERS = 75;   // how close two stops must be to count as "the same spot"
    const MIN_TRIPS_PER_ROUTE_GROUP = 2;     // a route needs at least this many trips before there's anything to compare
    let lastRouteGroups = []; // recomputed each time the STOPS tab opens - see renderStopStats

    window.addEventListener('load', () => {
        initMap();
        syncFromNative();
    });

    function syncFromNative() {
        if (window.Native && window.Native.getStateJson) {
            onNativeUpdate(JSON.parse(window.Native.getStateJson()));
        }
    }

    function initMap() {
        if (map) return;
        map = L.map('map-canvas', { zoomControl: false }).setView([0, 0], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 7, fillOpacity: 1 }).addTo(map);
        new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map-canvas'));
    }

    /** Called from MainActivity.pushStateToWebView() whenever TrackingService has new
      * state to report - on a location update, once a second while idling, and once
      * immediately whenever this page (re)loads. */
    function onNativeUpdate(state) {
        if (!state) return;
        isArmed = !!state.armed;

        document.getElementById('speed-out').innerText = state.speedKmh.toFixed(1);
        document.getElementById('live-dist').innerText = state.distanceKm.toFixed(2);
        document.getElementById('timer-display').innerText = state.idleSeconds.toFixed(1);

        const rateEl = document.getElementById('live-rate-val');
        rateEl.innerText = state.flowRating.toFixed(1);
        rateEl.style.color = state.flowRating >= 8 ? '#22c55e' : state.flowRating >= 4 ? '#f97316' : '#ef4444';

        const btn = document.getElementById('master-toggle');
        btn.classList.toggle('btn-active', isArmed);
        btn.innerText = isArmed ? "Finish Trip" : "Start Engine";

        if (userMarker && state.lat && state.lon) {
            userMarker.setLatLng([state.lat, state.lon]);
        }
    }

    function toggleEngine() {
        if (isArmed) {
            window.Native.finishTrip();
        } else {
            window.Native.startTrip();
            const btn = document.getElementById('master-toggle');
            btn.classList.add('btn-active');
            btn.innerText = "Finish Trip";
        }
    }

    function tab(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-btn-active'));
        document.getElementById('page-' + name).classList.add('active-page');
        document.getElementById('tab-' + name).classList.add('nav-btn-active');
        if (name === 'map') setTimeout(() => map.invalidateSize(), 50);
        if (name === 'logs') renderLogs();
        if (name === 'stops') renderStopStats();
        if (name === 'sys') renderDiagnosticLog();
    }

    /** Removes any drawn trip route/stop markers, leaving userMarker (the live
      * position dot) untouched either way - callers decide separately whether
      * that should be showing. Shared by showLiveMap() and viewTrip() so there's
      * one place that knows how to tell "a reviewed trip's layers" apart from
      * everything else on the map. */
    function clearMapOverlays() {
        map.eachLayer(l => { if (l instanceof L.Polyline || (l instanceof L.Circle && l !== userMarker)) map.removeLayer(l); });
    }

    /** The MAP nav tab's own entry point - clears any previously-reviewed trip's
      * route and makes sure the live position dot is showing, as opposed to
      * viewTrip()'s entry point below, which explicitly hides it. */
    function showLiveMap() {
        clearMapOverlays();
        if (!map.hasLayer(userMarker)) userMarker.addTo(map);
        tab('map');
    }

    function viewTrip(id) {
        const trip = JSON.parse(window.Native.getTripJson(id));
        if (!trip) return;
        tab('map');
        setTimeout(() => {
            clearMapOverlays();
            // The live position dot has nothing to do with a trip being reviewed
            // from history - showing it here previously left a stray marker
            // sitting at [0,0] or your current location, easy to mistake for
            // part of the reviewed route.
            if (map.hasLayer(userMarker)) map.removeLayer(userMarker);
            const pts = trip.path.map(p => [p.lat, p.lon]);
            const poly = L.polyline(pts, { color: '#00f2ff', weight: 5 }).addTo(map);
            (trip.stops || []).forEach(s => L.circle([s.lat, s.lon], { radius: 15, color: '#ff4444' }).addTo(map));
            if (pts.length) map.fitBounds(poly.getBounds());
        }, 100);
    }

    function renderLogs() {
        const trips = JSON.parse(window.Native.getTripsJson() || '[]');
        const list = document.getElementById('log-list');
        list.innerHTML = trips.length ? '' : '<div class="text-center mt-10 opacity-30 font-black uppercase">No Logs</div>';
        [...trips].reverse().forEach(t => {
            const score = t.rating || "0.0";
            const color = score >= 8 ? 'text-green-500' : score >= 4 ? 'text-orange-500' : 'text-red-500';
            const card = document.createElement('div');
            card.className = 'bg-zinc-900 border border-zinc-800 p-4 rounded-xl mb-3';
            card.innerHTML = `<div class="flex justify-between items-center mb-1"><span class="text-[10px] text-zinc-500">${new Date(t.start).toLocaleTimeString()}</span><span class="text-xs font-black ${color}">FLOW: ${score}</span></div><div class="flex justify-between items-center mb-3"><span class="text-[10px] text-zinc-400 uppercase">Distance</span><span class="text-sm font-bold">${t.dist.toFixed(2)} KM</span></div><button onclick="viewTrip(${t.id})" class="w-full bg-zinc-800 p-2 rounded text-[10px] font-black uppercase">Review Trip</button>`;
            list.appendChild(card);
        });
    }

    /** Groups trips into "similar trips" for comparison - defined here as sharing
      * roughly the same start point AND roughly the same end point (e.g. a
      * repeated commute), not just any two trips that happen to overlap
      * somewhere. Each trip joins the first group whose ANCHOR trip (the first
      * trip that started that group, chronologically) is within
      * ROUTE_ENDPOINT_MATCH_METERS at both ends - a single pass, not full
      * clustering, which is enough for "the same regular route" without pulling
      * in a real clustering library for what's normally a handful of route
      * groups. Trips with fewer than 2 path points (nothing to compare) and
      * groups that never reach MIN_TRIPS_PER_ROUTE_GROUP (nothing to actually
      * call "similar" yet) are both dropped before returning. */
    function groupTripsByRoute(trips) {
        const withEndpoints = trips.filter(t => t.path && t.path.length >= 2);
        const groups = [];
        withEndpoints.forEach(trip => {
            const start = trip.path[0], end = trip.path[trip.path.length - 1];
            const group = groups.find(g =>
                L.latLng(g.anchorStart.lat, g.anchorStart.lon).distanceTo([start.lat, start.lon]) <= ROUTE_ENDPOINT_MATCH_METERS
                && L.latLng(g.anchorEnd.lat, g.anchorEnd.lon).distanceTo([end.lat, end.lon]) <= ROUTE_ENDPOINT_MATCH_METERS);
            if (group) {
                group.trips.push(trip);
            } else {
                groups.push({ anchorStart: start, anchorEnd: end, trips: [trip] });
            }
        });
        return groups.filter(g => g.trips.length >= MIN_TRIPS_PER_ROUTE_GROUP);
    }

    /** Within one route group, clusters every recorded stop from every trip in
      * that group by proximity (STOP_CLUSTER_RADIUS_METERS) into named hotspots,
      * then ranks them by total time lost there across the whole group. Each
      * cluster tracks which distinct trips contributed to it (tripCount) as well
      * as total/average duration - a single trip that idled somewhere unusually
      * long for 20 minutes shouldn't outrank a spot that every other trip in the
      * group also got stuck at for a couple minutes each. */
    function clusterStops(group) {
        const clusters = [];
        group.trips.forEach(trip => {
            (trip.stops || []).forEach(stop => {
                let cluster = clusters.find(c =>
                    L.latLng(c.lat, c.lon).distanceTo([stop.lat, stop.lon]) <= STOP_CLUSTER_RADIUS_METERS);
                if (!cluster) {
                    cluster = { lat: stop.lat, lon: stop.lon, totalDur: 0, occurrences: [] };
                    clusters.push(cluster);
                }
                cluster.totalDur += stop.dur;
                cluster.occurrences.push({ tripId: trip.id, dur: stop.dur });
            });
        });
        clusters.forEach(c => {
            c.tripCount = new Set(c.occurrences.map(o => o.tripId)).size;
            c.avgDur = c.totalDur / c.occurrences.length;
        });
        return clusters.sort((a, b) => b.totalDur - a.totalDur);
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
        return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    /** STOPS tab's entry point - pulled fresh each time the tab opens, same
      * pattern as renderLogs()/renderDiagnosticLog(), since trips only change
      * when a new one finishes, not continuously. */
    function renderStopStats() {
        const trips = JSON.parse(window.Native.getTripsJson() || '[]');
        const groups = groupTripsByRoute(trips);
        lastRouteGroups = groups;
        const container = document.getElementById('stops-list');

        if (!groups.length) {
            container.innerHTML = '<div class="text-center mt-16 opacity-30 font-black uppercase text-xs px-6 leading-relaxed">No repeated routes yet<br><span class="opacity-70 normal-case font-normal text-[10px]">Drive the same start and end at least twice to compare stop times</span></div>';
            return;
        }

        container.innerHTML = '';
        groups.forEach((group, gi) => {
            const clusters = clusterStops(group).slice(0, 5); // top 5 hotspots per route
            const avgDist = group.trips.reduce((s, t) => s + t.dist, 0) / group.trips.length;
            const hotspotsHtml = clusters.length
                ? clusters.map((c, ci) => `
                    <div class="flex justify-between items-center py-2 border-t border-zinc-800">
                        <div>
                            <div class="text-[11px] font-bold">${formatDuration(c.totalDur)} total</div>
                            <div class="text-[9px] text-zinc-500 uppercase">${c.tripCount} of ${group.trips.length} trips &middot; avg ${formatDuration(c.avgDur)}</div>
                        </div>
                        <button onclick="viewHotspot(${gi}, ${ci})" class="bg-zinc-800 text-[9px] font-black uppercase px-3 py-1 rounded">View</button>
                    </div>`).join('')
                : '<div class="text-[10px] text-zinc-600 uppercase pt-2">No repeated stops on this route yet</div>';

            const card = document.createElement('div');
            card.className = 'bg-zinc-900 border border-zinc-800 p-4 rounded-xl mb-4';
            card.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-zinc-500 uppercase">Route &middot; ${group.trips.length} trips</span>
                    <span class="text-[10px] text-zinc-400">${avgDist.toFixed(2)} km avg</span>
                </div>
                <div class="text-[10px] text-zinc-600 uppercase font-bold mb-1">Most time stopped</div>
                ${hotspotsHtml}
            `;
            container.appendChild(card);
        });
    }

    /** Jumps to the MAP tab and highlights one hotspot in place, reusing the
      * same "clear old layers, drop the live marker" pattern as viewTrip() - a
      * hotspot being reviewed has the same "this isn't the live position"
      * problem the map-review bug fix already solved for a single trip's route. */
    function viewHotspot(groupIndex, clusterIndex) {
        const group = lastRouteGroups[groupIndex];
        if (!group) return;
        const cluster = clusterStops(group)[clusterIndex];
        if (!cluster) return;
        tab('map');
        setTimeout(() => {
            clearMapOverlays();
            if (map.hasLayer(userMarker)) map.removeLayer(userMarker);
            const highlight = L.circle([cluster.lat, cluster.lon], {
                radius: STOP_CLUSTER_RADIUS_METERS, color: '#facc15', weight: 3, fillOpacity: 0.15
            }).addTo(map);
            highlight.bindPopup(`${cluster.tripCount} of ${group.trips.length} trips &middot; ${formatDuration(cluster.totalDur)} total`).openPopup();
            map.setView([cluster.lat, cluster.lon], 17);
        }, 100);
    }

    function wipeAll() {
        if (confirm("Wipe?")) {
            window.Native.wipeAll();
            renderLogs();
        }
    }

    /** Pulled fresh each time the SYS tab opens, not continuously pushed - the log
      * is written natively by TrackingService regardless of whether this page is
      * even open, so there's nothing to keep live-synced while you're looking at a
      * different tab. */
    function renderDiagnosticLog() {
        const el = document.getElementById('diag-log');
        const text = window.Native.getDiagnosticLogText();
        el.textContent = text && text.trim() ? text : '(empty)';
    }

    function clearDiagnosticLog() {
        window.Native.clearDiagnosticLog();
        renderDiagnosticLog();
    }

    function shareDiagnosticLog() {
        window.Native.shareDiagnosticLog();
    }
</script>
</body>
</html>
